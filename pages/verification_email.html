<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verifying your account…</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #0f1115;
            font-family: Arial, sans-serif;
        }
        .ev-wrap {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .ev-card {
            width: 100%;
            max-width: 420px;
            background: #1b1e23;
            border-radius: 8px;
            padding: 40px;
            color: #ffffff;
            text-align: center;
        }
        .ev-spinner {
            width: 36px;
            height: 36px;
            margin: 0 auto 24px;
            border: 3px solid #343842;
            border-top-color: #2ea44f;
            border-radius: 50%;
            animation: ev-spin 0.8s linear infinite;
        }
        @keyframes ev-spin {
            to { transform: rotate(360deg); }
        }
        #ev-title {
            font-size: 20px;
            font-weight: bold;
            margin: 0 0 10px;
        }
        #ev-subtext {
            font-size: 14px;
            line-height: 20px;
            color: #c4c7cc;
            margin: 0;
        }
        #ev-signin {
            display: none;
            margin-top: 24px;
            background-color: #2ea44f;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="ev-wrap">
        <div class="ev-card" id="ev-card">
            <div id="ev-spinner" class="ev-spinner"></div>
            <p id="ev-title">Verifying your account…</p>
            <p id="ev-subtext">Hang on while we finish activating your account.</p>
            <a id="ev-signin" href="../index.html">Go to Sign In</a>
        </div>
        <div id="screensetContainer" style="display:none;width:100%;max-width:480px;"></div>
    </div>

    <script src="https://cdns.gigya.com/js/gigya.js?apikey=4_eqwSIEzYKaq7MI871n2USw"></script>
    <script src="../assets/js/sap-emarsys.js"></script>
    <script>
        // This page is the redirectURL target configured on $emailVerificationLink
        // in EmailVerificationTemplate.html. By the time CDC's hosted verification
        // endpoint lands the browser here, it has already verified the token
        // and logged the user in — so this just confirms the session exists,
        // then runs the same post-auth call the registration/login screens run
        // (see onAfterSubmit in assets/js/sap-cdc.js) before leaving this page.
        var HOME_URL = '../index.html';

        function buildHomeUrlWithAuth(regResult) {
            if (!regResult || !regResult.id_token || !regResult.patron_validation) {
                return HOME_URL;
            }
            var params = new URLSearchParams();
            params.set('id_token', regResult.id_token);
            params.set('patron_validation', regResult.patron_validation);
            return HOME_URL + '?' + params.toString();
        }

        function setStatus(title, subtext, showSignIn) {
            document.getElementById('ev-title').textContent = title;
            document.getElementById('ev-subtext').textContent = subtext || '';
            document.getElementById('ev-spinner').style.display = showSignIn ? 'none' : 'block';
            document.getElementById('ev-signin').style.display = showSignIn ? 'inline-block' : 'none';
        }

        function completeVerification(attempt) {
            attempt = attempt || 0;
            gigya.accounts.getAccountInfo({
                callback: function (res) {
                    if (res.errorCode === 0) {
                        setStatus('Account verified!', 'Finishing up your registration…', false);
                        showCompleteRegistrationScreen();
                        return;
                    }

                    // The session cookie set by CDC's verification redirect can take
                    // a moment to propagate before the SDK sees it — retry briefly
                    // before concluding verification didn't actually succeed.
                    if (attempt < 5) {
                        setTimeout(function () { completeVerification(attempt + 1); }, 400);
                        return;
                    }

                    setStatus(
                        "We couldn't verify your account automatically.",
                        'This link may have expired. Please sign in, or register again to receive a new verification email.',
                        true
                    );
                }
            });
        }

        // The session now exists (email verified), so hand off to the
        // complete-registration screen to collect any fields that aren't
        // part of the pre-verification register form, instead of finishing
        // the registration here. freshShopRegVerification only runs once that
        // screen itself is submitted successfully — same post-auth call the
        // login/registration screens run (see onAfterSubmit in sap-cdc.js).
        function showCompleteRegistrationScreen() {
            document.getElementById('ev-card').style.display = 'none';
            document.getElementById('screensetContainer').style.display = 'block';
            var regContact = null;
            gigya.accounts.showScreenSet({
                screenSet: 'mpaturu-RegistrationLogin',
                startScreen: 'mpaturu-gigya-complete-registration-screen',
                containerID: 'screensetContainer',
                onAfterScreenLoad: function (event) {
                    // The militaryId field is bound to the account's stored
                    // data.militaryId, which is always "0000000000" (the
                    // placeholder written at registration — see onSubmit in
                    // sap-cdc-registration-login.js). Blank it out so the
                    // user sees an empty field to enter their real ID into,
                    // not a confusing string of zeros.
                    var container = document.getElementById(event.containerID) || document;
                    var militaryIdInput = container.querySelector('input[name="data.militaryId"]');
                    if (militaryIdInput && militaryIdInput.value === '0000000000') {
                        militaryIdInput.value = '';
                    }
                },
                onBeforeSubmit: function (event) {
                    // Capture the militaryId/mobile the user entered on this
                    // screen directly, before the Global Config's own
                    // onBeforeSubmit/onSubmit (sap-cdc-registration-login.js)
                    // validates and scrubs the real militaryId to a placeholder
                    // for storage — this page needs the real value for the
                    // customer-profile/registration call below, which the
                    // shared Global Config has no way to hand back to us.
                    regContact = {
                        edipi: event.formData['data.militaryId'],
                        mobile: event.formData['profile.phones.number']
                    };
                    return true;
                },
                onAfterSubmit: function (e) {
                    if (e.response && e.response.errorCode === 0) {
                        Promise.resolve(typeof freshShopRegVerification === 'function' ? freshShopRegVerification('registration', regContact || {}) : null)
                            .catch(function () { return null; })
                            .then(function (regData) {
                                window.location.href = buildHomeUrlWithAuth(regData);
                            });
                    }
                    // On failure, leave the screen up — CDC's own inline field
                    // errors are already rendered by the SDK.
                }
            });
        }

        // The CDC Web SDK calls this global function automatically once it has
        // finished initializing — must be a plain global function named exactly
        // onGigyaServiceReady, not a property on another object.
        function onGigyaServiceReady() {
            completeVerification();
        }
    </script>

</body>
</html>
